[project]
name = "employee-operations-hub-api"
version = "0.1.0"
description = "Local API and assistant foundation for Employee Operations Hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-protocol>=1.0",
    "ag-ui-strands>=0.3",
    "email-validator>=2.3.0",
    "fastapi>=0.148.0",
    "openai>=2.0",
    "pydantic-settings>=2.16.0",
    "python-dotenv>=1.2.4",
    "strands-agents[anthropic]>=1.55",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
